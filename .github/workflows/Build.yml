
name: Build Mochi V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and extract the source ZIP
      - name: Extract Mochi source
        shell: bash
        run: |
          set -e

          echo "Searching for source ZIP..."

          find . -maxdepth 1 -type f -iname '*.zip' -print

          ZIP_COUNT=$(find . -maxdepth 1 -type f -iname '*.zip' | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ERROR: Keep exactly ONE source ZIP in the repository root."
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          echo "Using source: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Mochi source extracted successfully."

      # 4. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Build Android APK
      - name: Build Mochi V2 APK
        run: |
          gradle --no-daemon assembleDebug

      # 6. Upload APK
      - name: Upload Mochi V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
