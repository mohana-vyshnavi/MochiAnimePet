
name: Build Mochi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Mochi project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found!"
            exit 1
          fi

          echo "Using project: $ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            -name settings.gradle -o \
            -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found in ZIP!"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          cp -R "$PROJECT_DIR"/. .

      - name: Set Java and Kotlin compatibility
        run: |
          sed -i 's/jvmTarget = .*/jvmTarget = "17"/' app/build.gradle
          sed -i '/compileOptions {/,/}/c\
              compileOptions {\
                  sourceCompatibility JavaVersion.VERSION_17\
                  targetCompatibility JavaVersion.VERSION_17\
              }' app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Mochi APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
