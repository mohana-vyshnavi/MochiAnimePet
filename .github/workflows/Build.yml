
name: Build Mochi V2 Anime APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Mochi Anime Pet
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract the new Mochi source ZIP
      - name: Extract Mochi Anime Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="MochiV2-Anime-Transparent-Source.zip"

          echo "Looking for $ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project folder: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Mochi source extracted successfully."

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle configuration not found."
            exit 1
          fi

      # 4. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Build debug APK
      - name: Build Mochi V2 APK
        run: |
          gradle --no-daemon assembleDebug

      # 6. Upload APK
      - name: Upload Mochi V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
