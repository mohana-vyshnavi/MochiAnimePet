
name: Build Mochi V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Mochi V2
        run: |
          set -e
          mkdir extracted
          unzip -q MochiV2-Android-Source.zip -d extracted
          cp -a extracted/MochiV2/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V2 APK
        run: gradle --no-daemon assembleDebug

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
